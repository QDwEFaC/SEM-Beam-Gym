[project]
name = "sem-beam-gym"
version = "1.0.0"
description = "Среда Gymnasium и исследование RL-коррекции луча SEM при сетевой и вибрационной помехах"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "gymnasium==1.0.0",
    "matplotlib==3.11.2",
    "numpy==1.26.4",
    "pandas==3.0.6",
    "scipy==1.17.1",
    "stable-baselines3==2.4.1",
    "tabulate==0.10.0",
    "torch==2.5.1",
]

[project.scripts]
sem-beam = "sem_beam_gym.main:main"

[dependency-groups]
# ноутбук notebooks/pipeline.ipynb: ядро Jupyter и исполнение из командной строки
notebook = ["ipykernel>=6.29", "nbconvert>=7.16"]

[tool.uv]
default-groups = ["notebook"]

# torch - сборка для CPU: сеть маленькая, обучение на GPU не быстрее (README, раздел 5)
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
